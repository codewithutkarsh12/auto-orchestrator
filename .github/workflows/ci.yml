name: Python tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Installed package and CLI regression tests
        run: python -m pytest tests/test_packaging_cli.py -q
      - name: Full suite
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m auto_orchestrator.cli run 'Summarize text'
